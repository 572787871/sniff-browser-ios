# 正式构建 spec：包含 FFmpeg XCFramework 依赖与链接设置。
include: project.base.yml

targets:
  SniffBrowser:
    dependencies:
      - framework: vendor/FFmpeg.xcframework
        embed: false
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FFMPEG_ENABLED"
        OTHER_LDFLAGS: "$(inherited) -framework FFmpeg"
